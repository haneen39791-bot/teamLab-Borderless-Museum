<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#0e2d36"/>
      <stop offset="55%" stop-color="#0b1626"/>
      <stop offset="100%" stop-color="#080d18"/>
    </radialGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity=".55"/>
      <stop offset="60%" stop-color="#0d9488" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5eead4" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#5eead4" stop-opacity=".9"/>
      <stop offset="45%" stop-color="#2dd4bf" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurBig" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blurSm" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg2)"/>

  <!-- projected light halos -->
  <g filter="url(#blurBig)" opacity=".85">
    <ellipse cx="500" cy="380" rx="330" ry="300" fill="url(#halo)"/>
    <ellipse cx="250" cy="560" rx="180" ry="220" fill="url(#halo)" opacity=".55"/>
    <ellipse cx="770" cy="540" rx="190" ry="230" fill="url(#halo)" opacity=".5"/>
  </g>

  <!-- coral-stone arches inspired by Historic Jeddah -->
  <g fill="none" stroke="url(#arch)" stroke-width="16">
    <path d="M180 900 V470 a320 320 0 0 1 640 0 V900"/>
    <path d="M280 900 V500 a220 220 0 0 1 440 0 V900"/>
    <path d="M380 900 V520 a120 120 0 0 1 240 0 V900"/>
  </g>
  <g fill="none" stroke="#2dd4bf" stroke-opacity=".22" stroke-width="3">
    <path d="M180 900 V470 a320 320 0 0 1 640 0 V900"/>
    <path d="M280 900 V500 a220 220 0 0 1 440 0 V900"/>
  </g>

  <!-- light beams falling through the arches -->
  <g filter="url(#blurSm)" opacity=".6">
    <path d="M360 300 L500 880 L640 300 Z" fill="url(#beam)"/>
    <path d="M250 420 L330 880 L410 420 Z" fill="url(#beam)" opacity=".6"/>
    <path d="M690 430 L760 880 L820 430 Z" fill="url(#beam)" opacity=".5"/>
  </g>

  <!-- floating digital petals -->
  <g fill="#fbbf24" opacity=".75">
    <g transform="translate(300,260) rotate(20)"><ellipse rx="7" ry="16"/></g>
    <g transform="translate(430,180) rotate(-35)"><ellipse rx="6" ry="14"/></g>
    <g transform="translate(560,250) rotate(50)"><ellipse rx="8" ry="18"/></g>
    <g transform="translate(680,200) rotate(-15)"><ellipse rx="6" ry="13"/></g>
    <g transform="translate(760,330) rotate(40)"><ellipse rx="7" ry="15"/></g>
    <g transform="translate(240,400) rotate(-25)"><ellipse rx="5" ry="12"/></g>
    <g transform="translate(500,120) rotate(15)"><ellipse rx="5" ry="11"/></g>
    <g transform="translate(620,420) rotate(-40)"><ellipse rx="6" ry="14"/></g>
    <g transform="translate(370,470) rotate(30)"><ellipse rx="5" ry="12"/></g>
    <g transform="translate(820,470) rotate(-10)"><ellipse rx="5" ry="11"/></g>
  </g>
  <g fill="#5eead4" opacity=".8">
    <circle cx="350" cy="330" r="2.5"/><circle cx="470" cy="280" r="2"/><circle cx="600" cy="160" r="3"/>
    <circle cx="720" cy="270" r="2"/><circle cx="280" cy="520" r="2.5"/><circle cx="660" cy="540" r="2"/>
    <circle cx="520" cy="620" r="2.5"/><circle cx="400" cy="700" r="2"/><circle cx="790" cy="640" r="2"/>
  </g>

  <!-- reflective floor -->
  <rect x="0" y="860" width="1000" height="140" fill="url(#beam)" opacity=".35"/>
  <g filter="url(#blurSm)" opacity=".22" transform="translate(0,1720) scale(1,-1)">
    <path d="M360 300 L500 880 L640 300 Z" fill="url(#beam)"/>
  </g>

  <rect width="1000" height="1000" fill="none" stroke="#2dd4bf" stroke-opacity=".08" stroke-width="2"/>
</svg>
