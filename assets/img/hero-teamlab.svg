<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="52%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0e2d36"/>
      <stop offset="45%" stop-color="#0b1626"/>
      <stop offset="100%" stop-color="#080d18"/>
    </radialGradient>
    <linearGradient id="ribbon1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="35%" stop-color="#2dd4bf" stop-opacity=".9"/>
      <stop offset="70%" stop-color="#0d9488" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="40%" stop-color="#5eead4" stop-opacity=".85"/>
      <stop offset="80%" stop-color="#0d6e63" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#0d6e63" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbon3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#080d18" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#5eead4" stop-opacity=".95"/>
      <stop offset="40%" stop-color="#2dd4bf" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- glowing light ribbons -->
  <g filter="url(#soft)" opacity=".95">
    <path d="M-80 690 C 180 470, 300 250, 560 210 S 980 330, 1300 120" fill="none" stroke="url(#ribbon1)" stroke-width="120" stroke-linecap="round"/>
    <path d="M-120 330 C 200 540, 420 640, 700 500 S 1050 260, 1320 470" fill="none" stroke="url(#ribbon2)" stroke-width="150" stroke-linecap="round"/>
    <path d="M120 -60 C 340 260, 520 380, 820 300 S 1120 520, 1280 760" fill="none" stroke="url(#ribbon3)" stroke-width="100" stroke-linecap="round"/>
  </g>

  <!-- sharper inner light threads -->
  <g filter="url(#soft2)" opacity=".9">
    <path d="M-60 660 C 190 450, 320 260, 570 225 S 990 340, 1280 145" fill="none" stroke="url(#ribbon1)" stroke-width="26" stroke-linecap="round"/>
    <path d="M-100 350 C 210 550, 430 630, 710 495 S 1060 275, 1300 480" fill="none" stroke="url(#ribbon2)" stroke-width="22" stroke-linecap="round"/>
  </g>

  <!-- floating light particles -->
  <g fill="url(#glow)">
    <circle cx="180" cy="220" r="20"/><circle cx="310" cy="430" r="14"/><circle cx="420" cy="160" r="26"/>
    <circle cx="540" cy="380" r="12"/><circle cx="660" cy="130" r="18"/><circle cx="760" cy="470" r="22"/>
    <circle cx="880" cy="250" r="16"/><circle cx="1010" cy="540" r="28"/><circle cx="1120" cy="330" r="14"/>
    <circle cx="120" cy="560" r="16"/><circle cx="380" cy="620" r="12"/><circle cx="600" cy="560" r="18"/>
    <circle cx="930" cy="640" r="14"/><circle cx="1090" cy="700" r="20"/><circle cx="250" cy="720" r="11"/>
  </g>
  <g fill="#5eead4" opacity=".85">
    <circle cx="150" cy="300" r="2.5"/><circle cx="270" cy="520" r="2"/><circle cx="350" cy="240" r="3"/>
    <circle cx="470" cy="470" r="2"/><circle cx="590" cy="200" r="2.5"/><circle cx="700" cy="390" r="2"/>
    <circle cx="820" cy="170" r="3"/><circle cx="950" cy="420" r="2"/><circle cx="1060" cy="260" r="2.5"/>
    <circle cx="200" cy="650" r="2"/><circle cx="500" cy="660" r="2.5"/><circle cx="780" cy="620" r="2"/>
    <circle cx="990" cy="730" r="2.5"/><circle cx="1150" cy="580" r="2"/>
  </g>

  <!-- mirrored floor -->
  <rect x="0" y="640" width="1200" height="260" fill="url(#floor)"/>
  <g filter="url(#soft2)" opacity=".28" transform="translate(0,1280) scale(1,-1)">
    <path d="M-60 660 C 190 450, 320 260, 570 225 S 990 340, 1280 145" fill="none" stroke="url(#ribbon1)" stroke-width="40" stroke-linecap="round"/>
    <path d="M-100 350 C 210 550, 430 630, 710 495 S 1060 275, 1300 480" fill="none" stroke="url(#ribbon2)" stroke-width="34" stroke-linecap="round"/>
  </g>

  <!-- visitor silhouettes for scale -->
  <g fill="#080d18" opacity=".82">
    <ellipse cx="600" cy="742" rx="16" ry="6"/>
    <path d="M594 742 q-4 -34 1 -52 q4 -14 12 -14 q9 0 12 14 q5 18 1 52 z"/>
    <circle cx="607" cy="666" r="9"/>
    <ellipse cx="690" cy="756" rx="14" ry="5"/>
    <path d="M684 756 q-3 -28 1 -44 q3 -12 10 -12 q8 0 10 12 q4 16 1 44 z"/>
    <circle cx="696" cy="690" r="8"/>
  </g>

  <rect width="1200" height="900" fill="none" stroke="#2dd4bf" stroke-opacity=".08" stroke-width="2"/>
</svg>
